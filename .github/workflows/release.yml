name: Threadfin Build
on:
  push:
    tags: "1.*"
permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies and tests
        run: |
          go mod download
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor/
          go test -mod=vendor ./...

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Binaries
        run: |
          set -euo pipefail

          # Build all binaries in parallel
          echo "Building all platforms in parallel"
          pids=()
          
          # Linux builds
          env GOOS=linux GOARCH=arm64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_linux_arm64 &
          pids+=("$!")
          env GOOS=linux GOARCH=arm go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_linux_arm &
          pids+=("$!")
          env GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_linux_amd64 &
          pids+=("$!")
          # Linux (amd64) build compatible with older glibc (e.g., Debian 11 / glibc 2.31)
          env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -tags netgo -ldflags="-s -w" -o dist/Threadfin_linux_amd64_glibc_2.31_compat &
          pids+=("$!")
          
          # FreeBSD builds
          env GOOS=freebsd GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_freebsd_amd64 &
          pids+=("$!")
          env GOOS=freebsd GOARCH=arm go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_freebsd_arm &
          pids+=("$!")
          
          # macOS builds
          env GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_darwin_arm64 &
          pids+=("$!")
          env GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_darwin_amd64 &
          pids+=("$!")
          
          # Windows build
          env GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_windows_amd64.exe &
          pids+=("$!")
          
          # Wait for all background jobs to finish
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          
          # List all built binaries
          ls -la dist/

      - name: Sign release artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.THREADFIN_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY"
          signing_key=$(mktemp)
          cleanup() {
            rm -f "$signing_key"
          }
          trap cleanup EXIT
          chmod 600 "$signing_key"
          printf '%s' "$UPDATE_SIGNING_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout | cmp - src/internal/up2date/client/update-signing-public-key.pem

          assets=(dist/Threadfin_*)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            checksum=$(sha256sum "$asset")
            printf '%s\n' "${checksum%% *}" > "${asset}.sha256"
            openssl pkeyutl -sign -rawin -inkey "$signing_key" -in "${asset}.sha256" -out "${asset}.sha256.sig"
            openssl pkeyutl -verify -pubin -inkey src/internal/up2date/client/update-signing-public-key.pem -rawin -in "${asset}.sha256" -sigfile "${asset}.sha256.sig"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadfin-binaries
          path: dist/
          retention-days: 1

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and Push (Standard)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ghcr.io/volschin/threadfin:latest,ghcr.io/volschin/threadfin:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Build and Push (NVIDIA)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            USE_NVIDIA=1
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/volschin/threadfin:latest-nvidia,ghcr.io/volschin/threadfin:${{ github.ref_name }}-nvidia
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: threadfin-binaries
          path: dist

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
