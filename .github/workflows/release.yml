name: Threadfin Build
on:
  push:
    tags: "v*"
permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies and tests
        run: |
          go mod download
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor/
          go test -mod=vendor ./...

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Binaries
        run: |
          set -euo pipefail

          # Build all binaries in parallel
          echo "Building all platforms in parallel"
          pids=()
          
          # Linux builds
          env CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_linux_arm64 &
          pids+=("$!")
          env CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_linux_arm &
          pids+=("$!")
          env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_linux_amd64 &
          pids+=("$!")
          # Linux (amd64) build compatible with older glibc (e.g., Debian 11 / glibc 2.31)
          env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -tags netgo -ldflags="-s -w" -o dist/Threadfin_linux_amd64_glibc_2.31_compat &
          pids+=("$!")
          
          # FreeBSD builds
          env GOOS=freebsd GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_freebsd_amd64 &
          pids+=("$!")
          env GOOS=freebsd GOARCH=arm go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_freebsd_arm &
          pids+=("$!")
          
          # macOS builds
          env GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_darwin_arm64 &
          pids+=("$!")
          env GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_darwin_amd64 &
          pids+=("$!")
          
          # Windows build
          env GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o dist/Threadfin_windows_amd64.exe &
          pids+=("$!")
          
          # Wait for all background jobs to finish
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          
          # List all built binaries
          ls -la dist/

      - name: Sign release artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.THREADFIN_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY"
          signing_key=$(mktemp)
          cleanup() {
            rm -f "$signing_key"
          }
          trap cleanup EXIT
          chmod 600 "$signing_key"
          printf '%s' "$UPDATE_SIGNING_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout | cmp - src/internal/up2date/client/update-signing-public-key.pem

          assets=(dist/Threadfin_*)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            checksum=$(sha256sum "$asset")
            printf '%s\n' "${checksum%% *}" > "${asset}.sha256"
            openssl pkeyutl -sign -rawin -inkey "$signing_key" -in "${asset}.sha256" -out "${asset}.sha256.sig"
            openssl pkeyutl -verify -pubin -inkey src/internal/up2date/client/update-signing-public-key.pem -rawin -in "${asset}.sha256" -sigfile "${asset}.sha256.sig"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadfin-binaries
          path: dist/
          retention-days: 1

  docker:
    name: Build Docker Image (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            use_nvidia: ""
          - variant: standard
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            use_nvidia: ""
          - variant: nvidia
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            use_nvidia: "1"
          - variant: nvidia
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            use_nvidia: "1"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: threadfin-binaries
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            USE_PREBUILT=1
            USE_NVIDIA=${{ matrix.use_nvidia }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/volschin/threadfin,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker_manifest:
    name: Create Docker Manifest (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    needs: docker
    strategy:
      matrix:
        include:
          - variant: standard
            suffix: ""
          - variant: nvidia
            suffix: -nvidia
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify manifest
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          IMAGE: ghcr.io/volschin/threadfin
          VERSION: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          digest_files=("$DIGEST_DIR"/*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected two image digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("$IMAGE@sha256:${digest_file##*/}")
          done

          docker buildx imagetools create \
            --tag "$IMAGE:latest$SUFFIX" \
            --tag "$IMAGE:$VERSION$SUFFIX" \
            "${sources[@]}"

          manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION$SUFFIX" --raw)
          platforms=$(jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' <<< "$manifest" | sort -u)
          expected_platforms=$'linux/amd64\nlinux/arm64'
          if [ "$platforms" != "$expected_platforms" ]; then
            echo "Unexpected image platforms:" >&2
            printf '%s\n' "$platforms" >&2
            exit 1
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker_manifest]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: threadfin-binaries
          path: dist

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
