name: Threadfin CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify UI build
        run: |
          npm ci
          npm run build
          git diff --exit-code -- html/ src/webUI.go

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor/

      - name: Test
        run: go test -count=1 -mod=vendor ./...

      - name: Compile benchmarks
        run: go test -mod=vendor -run='^$' -bench='^$' ./...

      - name: Vet
        run: go vet -mod=vendor ./...

  archive-native:
    name: Archive Security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test native archive behavior
        run: go test -count=1 -mod=vendor ./src/internal/archive
