name: Bootstrap 6 Prototype
on:
  push:
    branches: [bootstrap-6]
permissions:
  contents: read
  packages: write
concurrency:
  group: bootstrap-6-prototype
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify UI build
        run: |
          npm ci
          npm run build
          git diff --exit-code -- html/ src/webUI.go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify prototype
        run: |
          go test -count=1 -mod=vendor ./...
          go vet -mod=vendor ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-specific preview
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/volschin/threadfin:bootstrap-6-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            THREADFIN_VERSION=bootstrap-6-prototype
          cache-from: type=gha,scope=bootstrap-6
          cache-to: type=gha,mode=max,scope=bootstrap-6
