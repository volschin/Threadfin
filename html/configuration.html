<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadfin</title>
  <link rel="stylesheet" href="css/vendor/fontawesome.min.css">
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body class="tf-setup-page">

  <div id="loading" class="tf-loading" role="status" aria-live="polite" hidden>Working…</div>

  <dialog id="popup" class="dialog dialog-xl" aria-label="Threadfin editor">
    <div class="dialog-content">
      <div class="tf-dialog-content">
        <div class="dialog-header" id="popup_header"></div>
        <div class="dialog-body">
          <div class="container-fluid">
            <div class="row">
              <div id="popup-custom"></div>
            </div>
          </div>
        </div>
        <div class="dialog-footer" id="popup_footer"></div>
      </div>
    </div>
  </dialog>

  <main class="tf-setup" aria-labelledby="head-text">
  <div id="header" class="imgCenter" aria-hidden="true"></div>
  <div id="box" class="tf-setup-panel">

    <div id="headline">
      <h1 id="head-text" class="center">{{.wizard.headline}}</h1>
      <p>{{.wizard.introduction}}</p>
    </div>
    <ol id="wizard-progress" class="tf-wizard-progress" aria-label="{{.wizard.stepsLabel}}">
      <li>{{.wizard.tuner.shortTitle}}</li>
      <li>{{.wizard.epgSource.shortTitle}}</li>
      <li>{{.wizard.m3u.shortTitle}}</li>
      <li>{{.wizard.xmltv.shortTitle}}</li>
    </ol>
    <p id="wizard-step-status" class="tf-wizard-step-status" aria-live="polite"></p>
    <p id="err" class="errorMsg center"></p>
    <div id="content">

    </div>
    <div id="box-footer">
      <input id="next" class="" type="button" name="next" value="Next">
    </div>
    <p id="wizard-request-status" class="tf-wizard-request-status" role="status" aria-live="polite"></p>
  </div>
  </main>
  <script type="module" src="js/setup.js"></script>
</body>

</html>
