<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadfin</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
  />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/screen.css" type="text/css">
  <link rel="stylesheet" href="css/base.css" type="text/css">
  <link rel="stylesheet" href="css/app-shell.css" type="text/css">
</head>

<body class="tf-auth-page">
  <nav class="navbar navbar-expand-lg sticky-top bg-black" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/web">
        <span id="logo"></span>
      </a>
    </div>
  </nav>
  <main id="content" class="tf-auth-main">
    <section class="tf-auth-card" aria-labelledby="auth-heading">
      <header>
        <h1 id="auth-heading">{{.login.headline}}</h1>
        <p>Sign in to manage Threadfin and its generated outputs.</p>
      </header>
      <p id="err" class="errorMsg" aria-live="polite">{{.authenticationErr}}</p>
      <form id="authentication" action="" method="post" onsubmit="return login(event);">
        <label for="username">{{.login.username.title}}</label>
        <input id="username" type="text" name="username" autocomplete="username" placeholder="Username" value="" autofocus required>
        <label for="password">{{.login.password.title}}</label>
        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" value="" required>
        <button id="submit" type="submit">{{.button.login}}</button>
      </form>
    </section>
  </main>

  <script language="javascript" type="text/javascript" src="js/authentication_ts.js"></script>
</body>

</html>
