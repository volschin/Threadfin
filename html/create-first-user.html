<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadfin</title>
  <link rel="stylesheet" href="css/vendor/fontawesome.min.css">
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body class="tf-auth-page">
  <main id="content" class="tf-auth-main">
    <section class="tf-auth-card" aria-labelledby="auth-heading">
      <header>
        <div id="header" class="imgCenter" aria-hidden="true"></div>
        <h1 id="auth-heading">{{.account.headline}}</h1>
        <p>Create the first administrator account. Its password is sent only by this form and is stored as an Argon2id verifier.</p>
      </header>
      <p id="err" class="errorMsg" aria-live="polite"></p>
      <form id="authentication" action="" method="post">
        <label for="username">{{.account.username.title}}</label>
        <input id="username" type="text" name="username" autocomplete="username" placeholder="Username" value="" autofocus required>
        <label for="password">{{.account.password.title}}</label>
        <input id="password" type="password" name="password" autocomplete="new-password" placeholder="Password" value="" required>
        <label for="confirm">{{.account.confirm.title}}</label>
        <input id="confirm" type="password" name="confirm" autocomplete="new-password" placeholder="Confirm" value="" required>
        <button id="submit" type="submit">{{.button.craeteAccount}}</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>

</html>
